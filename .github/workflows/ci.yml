name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  seite-pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Webseite testen (JS-Logik, Inhalte, HTML-Struktur)
        run: node tests/check-page.js
